plugins { id 'com.android.application' }

android {
    namespace 'com.beautyproof.trial'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.beautyproof.trial'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-trial'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('build/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; debuggable true }
        release { minifyEnabled false }
    }
}
