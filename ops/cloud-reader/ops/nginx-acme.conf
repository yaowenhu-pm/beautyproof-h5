# Bootstrap only: enable this HTTP server before requesting the certificate.
# It serves only ACME HTTP-01 files and does not proxy the reader application.
server {
    listen 80;
    listen [::]:80;
    server_name beautyproof-reader.121-196-215-79.sslip.io;

    server_tokens off;
    access_log /var/log/nginx/beautyproof-reader-acme.access.log;
    error_log /var/log/nginx/beautyproof-reader-acme.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beautyproof-reader-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
