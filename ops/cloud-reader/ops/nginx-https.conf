# Enable only after Certbot has created the referenced certificate files.
server {
    listen 80;
    listen [::]:80;
    server_name beautyproof-reader.121-196-215-79.sslip.io;

    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beautyproof-reader-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beautyproof-reader.121-196-215-79.sslip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/beautyproof-reader.121-196-215-79.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beautyproof-reader.121-196-215-79.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BeautyProofReaderTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/beautyproof-reader.access.log;
    error_log /var/log/nginx/beautyproof-reader.error.log warn;
    client_max_body_size 12k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /v1/resolve {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 40s;
    }

    location / {
        return 404;
    }
}
